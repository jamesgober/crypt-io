name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
  # The jobs below run on Linux only. Nightly-only jobs clear
  # RUSTFLAGS so a new nightly lint cannot fail them; the stable
  # matrix above keeps `-D warnings`.

  # Downstream users do not get our Cargo.lock, and Cargo's MSRV-aware
  # resolver (the default for edition 2024) picks different versions
  # for different Rust versions. Audit the committed lockfile and fresh
  # resolutions as a Rust 1.85 user, a 1.86 user and a newest-versions
  # user get them. The lockfile holds every package of every feature
  # and target, so each run covers all feature sets.
  audit:
    name: Audit (RustSec, ${{ matrix.lock }} lockfile)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lock: [committed, "1.85", "1.86", newest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Resolve the lockfile
        if: matrix.lock != 'committed'
        run: |
          if [ "${{ matrix.lock }}" = newest ]; then
            CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=allow cargo generate-lockfile
          else
            sed -i 's/^rust-version = ".*"/rust-version = "${{ matrix.lock }}"/' Cargo.toml
            CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo generate-lockfile
          fi
      # RUSTSEC-2026-0385: ctutils before 0.4.4 has non-constant-time
      # masks and u128 comparisons. Every fixed release needs Rust 1.87,
      # so a Rust 1.85 or 1.86 resolution can only stay clean by not
      # pulling ctutils in at all (crypt-io 1.2.2 dropped `hmac` for
      # that reason). Fail on any ctutils below 0.4.4, by name, even if
      # the advisory database is unreachable or the advisory changes.
      - name: No ctutils before 0.4.4 (RUSTSEC-2026-0385)
        run: |
          bad=""
          for v in $(awk '/^name = "ctutils"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock); do
            if [ "$(printf '%s\n' 0.4.4 "$v" | sort -V | head -n 1)" != 0.4.4 ]; then
              bad="$bad $v"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Cargo.lock has ctutils$bad, affected by RUSTSEC-2026-0385 (fixed in 0.4.4)"
            cargo tree -i ctutils --all-features --target all -e normal,build,dev || true
            exit 1
          fi
          echo "ctutils: $(grep -c '^name = "ctutils"$' Cargo.lock) entries, none before 0.4.4"
      - run: cargo audit

  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      # Downstream users do not get our Cargo.lock: check that the
      # floors declared in Cargo.toml resolve and build.
      - run: cargo update -Zminimal-versions
      - run: cargo build --all-features
      - run: cargo build
      - run: cargo build --no-default-features --features std,hash-blake3
      - run: cargo build --no-default-features --features std,aead-aes-gcm
      - run: cargo build --no-default-features --features std,kdf-argon2
      - run: cargo build --no-default-features --features std,zeroize,stream
      - run: cargo build --no-default-features --features std,getrandom,aead-chacha20
      - run: cargo build --no-default-features --features zeroize,mac-blake3

  docs-features:
    name: Docs (partial feature sets)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      # docs.rs builds with every feature (checked in the matrix
      # above). These sets catch intra-doc links to items that a
      # smaller feature set compiles out.
      - run: cargo doc --no-deps --no-default-features
      - run: cargo doc --no-deps --no-default-features --features mac-blake3
      - run: cargo doc --no-deps --no-default-features --features zeroize,mac-blake3
      - run: cargo doc --no-deps --no-default-features --features aead-chacha20,stream,kdf-argon2
      - run: cargo doc --no-deps --no-default-features --features std,aead-chacha20
      - run: cargo doc --no-deps --no-default-features --features std,hash-blake3
      - run: cargo doc --no-deps --no-default-features --features std,hash-sha2,mac-hmac,kdf-hkdf
      - run: cargo doc --no-deps --no-default-features --features std,stream

  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: thumbv7em-none-eabihf
      # Everything except the random-dependent APIs: no RNG at all.
      - run: >-
          cargo build --target thumbv7em-none-eabihf --no-default-features
          --features aead-chacha20,aead-aes-gcm,hash-blake3,hash-sha2,mac-hmac,mac-blake3,kdf-hkdf,kdf-argon2,stream,zeroize
      # The smallest no_std set a downstream crate uses for `wipe` plus
      # the keyed BLAKE3 MAC.
      - run: >-
          cargo build --target thumbv7em-none-eabihf --no-default-features
          --features zeroize,mac-blake3
      # The same set and the no-`zeroize` fallback, tested on the host.
      - run: cargo test --no-default-features --features zeroize,mac-blake3 --lib
      - run: cargo test --no-default-features --features zeroize,mac-blake3 --doc
      - run: cargo test --no-default-features --features mac-blake3 --lib
      # With the `getrandom` source. Bare metal has no OS RNG, so the
      # application registers a custom backend; a library build only
      # needs the cfg.
      - run: >-
          cargo build --target thumbv7em-none-eabihf --no-default-features
          --features getrandom,aead-chacha20,aead-aes-gcm,hash-blake3,hash-sha2,mac-hmac,mac-blake3,kdf-hkdf,kdf-argon2,stream,zeroize
        env:
          RUSTFLAGS: '-D warnings --cfg getrandom_backend="custom"'

  miri:
    name: Miri (subset)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      MIRIFLAGS: "-Zmiri-strict-provenance"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - run: cargo miri setup
      # Memory-handling paths: buffer wiping, key wipe on drop, the
      # stream decryptor, `_into` error paths and the frozen KATs.
      # Large-input tests are skipped or `cfg_attr(miri, ignore)`.
      - run: >-
          cargo miri test --all-features --lib --
          wipe:: stream:: aead::tests::round_trip_short aead::tests::tampered
          aead::aes_gcm_tests::round_trip_short
      - run: >-
          cargo miri test --all-features --test regressions --test kat --
          --skip update_and_update_into_agree

  fuzz-build:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz binary is statically linked (musl) and
      # would default to the musl target, which ASan does not support.
      - run: cargo fuzz build -O --target x86_64-unknown-linux-gnu
        working-directory: fuzz
