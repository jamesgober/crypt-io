name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.95.0", "1.85.0"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --component clippy --component rustfmt
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo test --locked
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  feature-profiles:
    name: Feature profiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.95.0", "1.85.0"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --component clippy
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-${{ matrix.rust }}-profiles-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --no-default-features --lib --locked -- -D warnings
      - run: cargo test --no-default-features --locked
      - run: cargo clippy --no-default-features --features kdf-hkdf --lib --locked -- -D warnings
      - run: cargo test --no-default-features --features kdf-hkdf --locked
      - run: cargo clippy --no-default-features --features signature-ed25519 --lib --locked -- -D warnings
      - run: cargo test --no-default-features --features signature-ed25519 --locked
      - run: cargo clippy --no-default-features --features storage-v1 --all-targets --locked -- -D warnings
      - run: cargo test --no-default-features --features storage-v1 --locked

  fuzz-compile:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --component clippy
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ubuntu-1.95.0-fuzz-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

  forward-compat:
    name: Forward compatibility (Rust 1.97.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --component clippy
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-1.97.1-forward-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked

  api-compat:
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-1.95.0-semver-${{ hashFiles('Cargo.lock') }}
      - run: cargo install cargo-semver-checks --locked --version 0.48.0
      - run: cargo semver-checks check-release --baseline-rev v1.0.0 --release-type minor --all-features

  cross-target:
    name: Cross-target MSRV (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RUSTUP_TOOLCHAIN: "1.85.0"
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - aarch64-pc-windows-msvc
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --target "${CARGO_BUILD_TARGET}"
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-1.85-cross-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo check --no-default-features --features signature-ed25519 --locked
      # Foreign targets do not have their native C/assembly toolchains on the
      # Ubuntu runner. Keep the optimized BLAKE3 paths covered by native jobs.
      - run: cargo check --all-features --features blake3/pure --locked

  security:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-1.95.0-security-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
      - run: cargo install cargo-deny --locked --version 0.19.8
      - run: cargo install cargo-audit --locked --version 0.22.1
      - run: cargo deny check
      - run: cargo audit --db "${RUNNER_TEMP}/cargo-audit-db" --deny warnings
      - run: cargo deny check
        working-directory: fuzz
      - run: cargo audit --db "${RUNNER_TEMP}/cargo-audit-db" --deny warnings
        working-directory: fuzz
