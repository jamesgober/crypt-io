# cargo-deny policy for the standalone libFuzzer harness workspace.

[graph]
all-features = true
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "NCSA",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
    { crate = "aead@0.5.2", reason = "chacha20poly1305 0.10 compatibility line" },
    { crate = "block-buffer@0.10.4", reason = "argon2 0.5 compatibility line" },
    { crate = "cipher@0.4.4", reason = "chacha20poly1305 0.10 compatibility line" },
    { crate = "cpufeatures@0.2.17", reason = "chacha20poly1305 and argon2 compatibility line" },
    { crate = "crypto-common@0.1.7", reason = "chacha20poly1305 and argon2 compatibility line" },
    { crate = "digest@0.10.7", reason = "argon2 0.5 compatibility line" },
    { crate = "getrandom@0.2.17", reason = "frozen 1.0 RustCrypto and Argon2 compatibility line" },
    { crate = "getrandom@0.3.4", reason = "libfuzzer and BLAKE3 build-tool compatibility line" },
    { crate = "inout@0.1.4", reason = "chacha20poly1305 0.10 compatibility line" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3 target-support compatibility line" },
    { crate = "universal-hash@0.5.1", reason = "chacha20poly1305 0.10 compatibility line" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
