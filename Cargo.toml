[package]
name = "crypt-io"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0 OR MIT"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "AEAD encryption (ChaCha20-Poly1305, AES-256-GCM), hashing (BLAKE3, SHA-2), MAC (HMAC, BLAKE3 keyed), and KDF (HKDF, Argon2id) for Rust. Algorithm-agile. RustCrypto-backed primitives with REPS discipline. Simple API. Sub-microsecond throughput."

# 5 keywords for search optimization
keywords = [
    "encryption",
    "cryptography",
    "ciphers",
    "crypto",
    "hash"
]

# 5 categories for discoverability
categories = [
    "cryptography",
    "authentication",
    "algorithms",
    "encoding",
    "data-structures"
]

documentation = "https://docs.rs/crypt-io"
repository    = "https://github.com/jamesgober/crypt-io"
homepage      = "https://github.com/jamesgober/crypt-io"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "crypt_io"
path = "src/lib.rs"

[features]
# Defaults: ChaCha20-Poly1305 + AES-256-GCM (AEAD) + BLAKE3 + SHA-2
# (hashing) + HMAC + BLAKE3 keyed (MAC) + HKDF + Argon2id (KDF).
# Gives a fresh `cargo add crypt-io` the full symmetric-crypto + KDF
# toolkit out of the box.
default = ["std", "zeroize", "aead-chacha20", "aead-aes-gcm", "hash-blake3", "hash-sha2", "mac-hmac", "mac-blake3", "kdf-hkdf", "kdf-argon2", "stream"]

# Core
std = []                              # Standard library (default on)
zeroize = ["dep:zeroize"]             # Zero key buffers on drop (default on)

# Versioned authenticated formats for storage engines. This is deliberately
# opt-in so the frozen 1.0 default feature set remains unchanged.
storage-v1 = [
    "std",
    "dep:zeroize",
    "zeroize/alloc",
    "dep:aes-gcm",
    "dep:aes",
    "dep:polyval",
    "dep:sha2",
    "sha2/zeroize",
    "dep:hmac",
    "hmac/zeroize",
    "dep:hkdf",
    "dep:getrandom",
    "dep:subtle",
]

# Strict detached Ed25519 verification for pre-authenticated byte strings.
# This is deliberately non-default and does not force `std`; signing, key
# generation, trust policy, and PKCS#8/PEM parsing remain out of scope.
signature-ed25519 = ["dep:ed25519-dalek"]

# AEAD encryption algorithms
aead-chacha20 = ["dep:chacha20poly1305"]  # ChaCha20-Poly1305 (default)
aead-aes-gcm = ["dep:aes-gcm", "dep:aes", "dep:polyval"] # AES-256-GCM (hw-accel)
aead-all = ["aead-chacha20", "aead-aes-gcm"]

# Hashing algorithms
hash-blake3 = ["dep:blake3"]          # BLAKE3 (default - fastest; 32-byte + XOF)
hash-sha2 = ["dep:sha2"]              # SHA-256, SHA-512 (interop)
hash-all = ["hash-blake3", "hash-sha2"]

# MAC (Message Authentication Code)
mac-hmac = ["dep:hmac", "hash-sha2"]  # HMAC-SHA256, HMAC-SHA512
mac-blake3 = ["hash-blake3"]          # BLAKE3 keyed mode
mac-all = ["mac-hmac", "mac-blake3"]

# KDF (Key Derivation Functions)
kdf-hkdf = ["dep:hkdf", "hash-sha2"]  # HKDF (key derivation)
kdf-argon2 = ["dep:argon2"]           # Argon2id (password hashing)
kdf-all = ["kdf-hkdf", "kdf-argon2"]

# Stream/file encryption (chunked AEAD with STREAM-construction).
# Pulls both AEAD backends so callers can pick either at runtime.
stream = ["aead-chacha20", "aead-aes-gcm"]

# Quality-of-life
metrics = ["dep:metrics-lib"]         # Performance instrumentation
logging = ["dep:log-io"]              # Operation logging
async-trait = ["dep:async-trait"]     # Async API surface

# Convenience presets
preset-all = ["std", "zeroize", "aead-all", "hash-all", "mac-all", "kdf-all", "stream"]
preset-minimal = ["std", "aead-chacha20"]

[dependencies]
# Cryptographic primitives (RustCrypto + BLAKE3)
chacha20poly1305 = { version = "0.10", optional = true }
# The 0.11 RustCrypto stack is required for AES/POLYVAL expanded-state
# zeroization on every supported backend. Its complete new transitive line
# declares rust-version = 1.85 (aead, block-buffer, cipher, cmov, cpubits,
# crypto-common, ctutils, ctr, digest, ghash, hybrid-array, inout, and
# universal-hash); the exact direct versions below also declare 1.85.
aes-gcm = { version = "=0.11.0", default-features = false, features = ["aes", "alloc", "zeroize"], optional = true }
# Direct feature-unification pins ensure expanded AES and POLYVAL state is
# zeroized by the same effective primitive used by both public surfaces.
aes = { version = "=0.9.1", default-features = false, features = ["zeroize"], optional = true }
polyval = { version = "=0.7.2", default-features = false, features = ["zeroize"], optional = true }
blake3 = { version = "1", optional = true }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"], optional = true }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"], optional = true }
hkdf = { version = "=0.13.0", default-features = false, optional = true }
# Direct OS entropy for the new storage formats. Version 0.4.3 is exact-pinned
# at this security boundary, declares the crate's Rust 1.85 MSRV, and adds no
# normal dependency on the supported desktop/server targets beyond cfg-selected
# platform bindings already covered by the cross-target CI matrix.
getrandom = { version = "=0.4.3", default-features = false, optional = true }
argon2 = { version = "0.5", optional = true }
# Constant-time binding comparisons. subtle 2.6.1 has no manifest MSRV field;
# the all-features graph is verified with the crate's frozen Rust 1.85 MSRV.
subtle = { version = "=2.6.1", default-features = false, optional = true }
# Exact-pinned because this is a security boundary. ed25519-dalek 3.0.0 and
# its normal/build graph declare Rust 1.85 or older: curve25519-dalek 5.0.0,
# ed25519 3.0.0, signature 3.0.0, sha2 0.11.0, subtle 2.6.1,
# rustc_version 0.4.1, semver 1.0.28, and target-specific fiat/derive crates.
# Disabling upstream defaults excludes `fast` precomputation as well as every
# signing-adjacent convenience feature; MODEL-PACK verification is infrequent,
# so a smaller auditable graph is preferred over extra verification throughput.
ed25519-dalek = { version = "=3.0.0", default-features = false, optional = true }

# Portfolio dependencies
mod-rand = { version = "1" }          # CSPRNG for nonces, salts, IVs
error-forge = { version = "1" }       # Error handling
log-io = { version = "1", optional = true }
metrics-lib = { version = "1", optional = true }

# Optional secret zeroing
zeroize = { version = "=1.9.0", default-features = false, optional = true, features = ["derive"] }

# Optional async support
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
hex = "0.4"
# Published-vector fixtures only. hex-literal declares Rust 1.85; serde and
# serde_json (including their new transitives) declare Rust 1.71 or older.
hex-literal = "=1.1.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
# Portfolio heap profiler — drives `examples/profile_alloc.rs`.
# Lower MSRV than `dhat`, ~60 ns/op overhead, dhat-compatible JSON
# output. Only pulled in for the example binary.
mod-alloc = "1"

[[example]]
name = "profile_alloc"
required-features = ["aead-chacha20", "aead-aes-gcm"]

[[example]]
name = "aead_round_trip"
required-features = ["aead-chacha20", "aead-aes-gcm"]

[[example]]
name = "derive_subkeys"
required-features = ["kdf-hkdf"]

[[example]]
name = "encrypt_file"
required-features = ["stream"]

[[example]]
name = "mac_authenticate"
required-features = ["mac-hmac", "mac-blake3"]

[[example]]
name = "password_hash"
required-features = ["kdf-argon2"]

[[example]]
name = "sealed_record"
required-features = ["storage-v1"]

[[test]]
name = "ed25519_contract"
required-features = ["signature-ed25519"]

[[bench]]
name = "aead"
harness = false
required-features = ["aead-chacha20", "aead-aes-gcm"]

[[bench]]
name = "hash"
harness = false
required-features = ["hash-blake3", "hash-sha2"]

[[bench]]
name = "mac"
harness = false
required-features = ["mac-hmac", "mac-blake3"]

[[bench]]
name = "kdf"
harness = false
required-features = ["kdf-hkdf", "kdf-argon2"]

[[bench]]
name = "stream"
harness = false
required-features = ["stream"]

[[bench]]
name = "storage"
harness = false
required-features = ["storage-v1"]

[[bench]]
name = "signature"
harness = false
required-features = ["signature-ed25519"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
