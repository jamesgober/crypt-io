[package]
name = "crypt-io"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0 OR MIT"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "AEAD encryption (ChaCha20-Poly1305, AES-256-GCM), hashing (BLAKE3, SHA-2), MAC (HMAC, BLAKE3 keyed), and KDF (HKDF, Argon2id) for Rust. Algorithm-agile. RustCrypto-backed primitives with REPS discipline. Simple API. Sub-microsecond throughput."

# 5 keywords for search optimization
keywords = [
    "encryption",
    "cryptography",
    "ciphers",
    "crypto",
    "hash"
]

# 5 categories for discoverability
categories = [
    "cryptography",
    "authentication",
    "algorithms",
    "encoding",
    "data-structures"
]

documentation = "https://docs.rs/crypt-io"
repository    = "https://github.com/jamesgober/crypt-io"
homepage      = "https://github.com/jamesgober/crypt-io"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "crypt_io"
path = "src/lib.rs"

[features]
# Defaults: ChaCha20-Poly1305 + AES-256-GCM (AEAD) + BLAKE3 + SHA-2
# (hashing) + HMAC + BLAKE3 keyed (MAC) + HKDF + Argon2id (KDF).
# Gives a fresh `cargo add crypt-io` the full symmetric-crypto + KDF
# toolkit out of the box.
default = ["std", "zeroize", "aead-chacha20", "aead-aes-gcm", "hash-blake3", "hash-sha2", "mac-hmac", "mac-blake3", "kdf-hkdf", "kdf-argon2", "stream"]

# Core
# Standard library (default on). Turns on the upstream `std` features
# (runtime CPU-feature detection in BLAKE3, `std::error::Error` impls)
# and the `mod-rand` OS random source. Without `std` the crate is
# `no_std` + `alloc`; see docs/PLATFORM-NOTES.md for what works there.
std = [
    "dep:mod-rand",
    "chacha20poly1305?/std",
    "aes-gcm?/std",
    "blake3?/std",
    "argon2?/std",
    "getrandom?/std",
]
# Use the `getrandom` crate as the random source for nonces, salts and
# keys. Required for the random-dependent APIs (`encrypt*`, `seal*`,
# `StreamEncryptor::new*`, `argon2_hash*`, `generate_key`) in `no_std`
# builds. With `std` it replaces `mod-rand`.
getrandom = ["dep:getrandom"]
# Wipe key copies and plaintext scratch buffers held by crypt-io types
# (stream encryptor/decryptor, `_into` failure paths, BLAKE3 keyed MAC)
# with volatile writes, and turn on the upstream `zeroize` support in
# aes-gcm, aes (round keys), sha2 and hmac (hash and MAC state),
# argon2 and blake3. Default on.
zeroize = [
    "dep:zeroize",
    "aes-gcm?/zeroize",
    "aes?/zeroize",
    "sha2?/zeroize",
    "hmac?/zeroize",
    "argon2?/zeroize",
    "blake3?/zeroize",
]

# AEAD encryption algorithms
aead-chacha20 = ["dep:chacha20poly1305"]  # ChaCha20-Poly1305 and XChaCha20-Poly1305 (default)
aead-aes-gcm = ["dep:aes-gcm", "dep:aes"] # AES-256-GCM (hw-accel)
aead-all = ["aead-chacha20", "aead-aes-gcm"]

# Hashing algorithms
hash-blake3 = ["dep:blake3"]          # BLAKE3 (default - fastest; 32-byte + XOF)
hash-sha2 = ["dep:sha2"]              # SHA-256, SHA-512 (interop)
hash-all = ["hash-blake3", "hash-sha2"]

# MAC (Message Authentication Code)
mac-hmac = ["dep:hmac", "hash-sha2"]  # HMAC-SHA256, HMAC-SHA512
mac-blake3 = ["hash-blake3"]          # BLAKE3 keyed mode
mac-all = ["mac-hmac", "mac-blake3"]

# KDF (Key Derivation Functions)
kdf-hkdf = ["dep:hkdf", "dep:hmac", "hash-sha2"]  # HKDF (key derivation)
kdf-argon2 = ["dep:argon2"]           # Argon2id (password hashing)
kdf-all = ["kdf-hkdf", "kdf-argon2"]

# Stream/file encryption (chunked AEAD with STREAM-construction).
# Pulls both AEAD backends so callers can pick either at runtime, and
# HKDF-SHA256 for the per-stream subkey of format v2.
stream = ["aead-chacha20", "aead-aes-gcm", "dep:hkdf", "dep:hmac", "dep:sha2"]

# Reserved. These features enable nothing in 1.0.x (no code ever used
# the dependencies they used to pull in). They are kept so that
# existing `features = [...]` lists keep resolving.
metrics = []
logging = []
async-trait = []

# Convenience presets
preset-all = ["std", "zeroize", "aead-all", "hash-all", "mac-all", "kdf-all", "stream"]
preset-minimal = ["std", "aead-chacha20"]

[dependencies]
# Cryptographic primitives (RustCrypto + BLAKE3). Default features are
# off so the crate builds without `std`; `std` is forwarded through
# crypt-io's own `std` feature.
chacha20poly1305 = { version = "0.10", optional = true, default-features = false, features = ["alloc"] }
# 0.10.3 is the first release that verifies the tag before decrypting
# in place (RUSTSEC-2023-0096).
aes-gcm = { version = "0.10.3", optional = true, default-features = false, features = ["aes", "alloc"] }
# Direct dependency only so the `zeroize` feature can turn on
# `aes/zeroize` (wipes the AES round keys when a cipher is dropped).
aes = { version = "0.8.4", optional = true, default-features = false }
blake3 = { version = "1.5", optional = true, default-features = false }   # 1.5 is the first release with a `zeroize` feature
sha2 = { version = "0.11", optional = true, default-features = false }
hmac = { version = "0.13", optional = true, default-features = false }
hkdf = { version = "0.13", optional = true, default-features = false }
argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }
# Constant-time comparison for `Tag`.
subtle = { version = "2.5", default-features = false }

# Random sources. `mod-rand` (portfolio crate, OS CSPRNG) with `std`;
# `getrandom` when the `getrandom` feature is on.
mod-rand = { version = "1", optional = true }
getrandom = { version = "0.4", optional = true, default-features = false }

# Optional secret zeroing
zeroize = { version = "1.7", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
hex = "0.4"
# Portfolio heap profiler — drives `examples/profile_alloc.rs`.
# Lower MSRV than `dhat`, ~60 ns/op overhead, dhat-compatible JSON
# output. Only pulled in for the example binary.
mod-alloc = "1"

[[example]]
name = "profile_alloc"

[[bench]]
name = "aead"
harness = false

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "mac"
harness = false

[[bench]]
name = "kdf"
harness = false

[[bench]]
name = "stream"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true